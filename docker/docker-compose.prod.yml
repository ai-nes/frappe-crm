name: crm-prod

x-crm-service: &crm-service
  image: ${CRM_IMAGE:?set CRM_IMAGE in docker/.env}
  pull_policy: always
  environment:
    DB_HOST: mariadb
    REDIS_CACHE: redis://redis-cache:6379
    REDIS_QUEUE: redis://redis-queue:6379
    REDIS_SOCKETIO: redis://redis-queue:6379
    SOCKETIO_PORT: ${SOCKETIO_PORT:-9000}
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

x-crm-depends-on: &crm-depends-on
  mariadb:
    condition: service_healthy
  redis-cache:
    condition: service_healthy
  redis-queue:
    condition: service_healthy

services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs on every `docker compose up`, not just first-time setup - creates
  # the site if missing, then always runs `bench migrate` so the DB schema
  # never drifts behind the deployed app code (this used to be gated behind
  # the `setup` profile, which meant ordinary deploys silently skipped
  # migrate and left new DocType columns like User.form_navigation_buttons
  # missing until someone remembered to run this by hand).
  site:
    <<: *crm-service
    command: bash /opt/frappe/scripts/prod-site.sh
    restart: "no"
    environment:
      SITE_NAME: ${SITE_NAME:?set SITE_NAME in docker/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
      SOCKETIO_PORT: ${SOCKETIO_PORT:-9000}
    depends_on: *crm-depends-on

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        # Preserve the scheme an upstream TLS-terminating proxy (Traefik,
        # Dokploy, Cloudflare Tunnel, etc) already set. Without this,
        # $$scheme below always resolves to "http" - this container only
        # listens on plain HTTP - which breaks any absolute URL Frappe
        # builds (OAuth redirect_uri, emails, webhooks) by giving them the
        # wrong protocol.
        map $$http_x_forwarded_proto $$proxy_x_forwarded_proto {
          default $$http_x_forwarded_proto;
          ''      $$scheme;
        }

        server {
          listen 8080;
          server_name _;

          client_max_body_size 50m;

          location = /assets/assets.json {
            alias /home/frappe/frappe-bench/sites/assets/assets.json;
            access_log off;
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
          }

          location /assets/ {
            alias /home/frappe/frappe-bench/sites/assets/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $$uri =404;
          }

          location /socket.io {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$proxy_x_forwarded_proto;
            proxy_pass http://websocket:9000;
          }

          location / {
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$proxy_x_forwarded_proto;
            proxy_read_timeout 120s;
            proxy_pass http://backend:8000;
          }
        }
        EOF
        exec nginx -g "daemon off;"
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - /dev/null:/var/log/nginx/access.log
      - /dev/null:/var/log/nginx/error.log
    ports:
      - "${HTTP_PORT:-8000}:8080"
    depends_on:
      assets:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      websocket:
        condition: service_started

  assets:
    <<: *crm-service
    pull_policy: always
    user: root
    restart: "no"
    # SITE_NAME is only needed here (on top of the crm-service anchor's
    # vars) so prod-assets.sh can clear this site's cached pages - explicit
    # environment: replaces the anchor's block wholesale in YAML, so every
    # var the anchor set has to be repeated (same pattern as the `site`
    # service above).
    environment:
      SITE_NAME: ${SITE_NAME:?set SITE_NAME in docker/.env}
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
      SOCKETIO_PORT: ${SOCKETIO_PORT:-9000}
    command: bash /opt/frappe/scripts/prod-assets.sh
    # Must run after `site` so the schema (and thus the cache it clears) is
    # already migrated - everything else waits on `assets` completing, so
    # this one edge is enough to put `site` ahead of the whole stack.
    depends_on:
      site:
        condition: service_completed_successfully

  backend:
    <<: *crm-service
    restart: unless-stopped
    networks:
      - default
      - ai-crm_backend
    command:
      - bash
      - /opt/frappe/scripts/prod-runtime.sh
      - ./env/bin/gunicorn
      - --chdir=/home/frappe/frappe-bench/sites
      - --bind=0.0.0.0:8000
      - --threads=4
      - --workers=${GUNICORN_WORKERS:-2}
      - --worker-class=gthread
      - --worker-tmp-dir=/dev/shm
      - --timeout=120
      - frappe.app:application
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: ${SITE_NAME:?set SITE_NAME in docker/.env}\" http://localhost:8000/api/method/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      assets:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  websocket:
    <<: *crm-service
    restart: unless-stopped
    command:
      - bash
      - /opt/frappe/scripts/prod-runtime.sh
      - node
      - apps/frappe/socketio.js
    depends_on:
      assets:
        condition: service_completed_successfully
      redis-queue:
        condition: service_healthy

  queue-short:
    <<: *crm-service
    restart: unless-stopped
    command:
      - bash
      - /opt/frappe/scripts/prod-runtime.sh
      - bench
      - worker
      - --queue
      - short
    depends_on:
      assets:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  queue-default:
    <<: *crm-service
    restart: unless-stopped
    command:
      - bash
      - /opt/frappe/scripts/prod-runtime.sh
      - bench
      - worker
      - --queue
      - default
    depends_on:
      assets:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  queue-long:
    <<: *crm-service
    restart: unless-stopped
    command:
      - bash
      - /opt/frappe/scripts/prod-runtime.sh
      - bench
      - worker
      - --queue
      - long
    depends_on:
      assets:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  scheduler:
    <<: *crm-service
    restart: unless-stopped
    command:
      - bash
      - /opt/frappe/scripts/prod-runtime.sh
      - bench
      - schedule
    depends_on:
      assets:
        condition: service_completed_successfully
      mariadb:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

volumes:
  mariadb-data:
  sites:
  logs:

networks:
  default:
    name: crm-prod_default
  ai-crm_backend:
    external: true
    name: ai-crm_backend

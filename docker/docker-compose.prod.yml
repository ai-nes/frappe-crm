name: crm-prod

x-crm-service: &crm-service
  image: ${CRM_IMAGE:?set CRM_IMAGE in docker/.env}
  pull_policy: always
  environment:
    DB_HOST: mariadb
    REDIS_CACHE: redis://redis-cache:6379
    REDIS_QUEUE: redis://redis-queue:6379
    REDIS_SOCKETIO: redis://redis-queue:6379
    SOCKETIO_PORT: ${SOCKETIO_PORT:-9000}
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
    volumes:
      - mariadb-data:/var/lib/mysql

  redis-cache:
    image: redis:alpine
    restart: unless-stopped

  redis-queue:
    image: redis:alpine
    restart: unless-stopped

  site:
    <<: *crm-service
    command: bash /opt/frappe/scripts/prod-site.sh
    environment:
      SITE_NAME: ${SITE_NAME:?set SITE_NAME in docker/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      DB_HOST: mariadb
      REDIS_CACHE: redis://redis-cache:6379
      REDIS_QUEUE: redis://redis-queue:6379
      REDIS_SOCKETIO: redis://redis-queue:6379
      SOCKETIO_PORT: ${SOCKETIO_PORT:-9000}
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
    profiles:
      - setup

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - sites:/home/frappe/frappe-bench/sites:ro
      - /dev/null:/var/log/nginx/access.log
      - /dev/null:/var/log/nginx/error.log
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-8000}:8080"
    depends_on:
      - backend
      - websocket

  backend:
    <<: *crm-service
    restart: unless-stopped
    command: >
      bash -lc 'cd /home/frappe/frappe-bench &&
      bench set-mariadb-host "$${DB_HOST}" &&
      bench set-redis-cache-host "$${REDIS_CACHE}" &&
      bench set-redis-queue-host "$${REDIS_QUEUE}" &&
      bench set-redis-socketio-host "$${REDIS_SOCKETIO}" &&
      bench set-config -g socketio_port "$${SOCKETIO_PORT}" &&
      ./env/bin/gunicorn
      --chdir=/home/frappe/frappe-bench/sites
      --bind=0.0.0.0:8000
      --threads=4
      --workers=${GUNICORN_WORKERS:-2}
      --worker-class=gthread
      --worker-tmp-dir=/dev/shm
      --timeout=120
      frappe.app:application'
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue

  websocket:
    <<: *crm-service
    restart: unless-stopped
    command: >
      bash -lc 'cd /home/frappe/frappe-bench &&
      bench set-mariadb-host "$${DB_HOST}" &&
      bench set-redis-cache-host "$${REDIS_CACHE}" &&
      bench set-redis-queue-host "$${REDIS_QUEUE}" &&
      bench set-redis-socketio-host "$${REDIS_SOCKETIO}" &&
      bench set-config -g socketio_port "$${SOCKETIO_PORT}" &&
      node apps/frappe/socketio.js'
    depends_on:
      - redis-queue

  queue-short:
    <<: *crm-service
    restart: unless-stopped
    command: >
      bash -lc 'cd /home/frappe/frappe-bench &&
      bench set-mariadb-host "$${DB_HOST}" &&
      bench set-redis-cache-host "$${REDIS_CACHE}" &&
      bench set-redis-queue-host "$${REDIS_QUEUE}" &&
      bench set-redis-socketio-host "$${REDIS_SOCKETIO}" &&
      bench set-config -g socketio_port "$${SOCKETIO_PORT}" &&
      bench worker --queue short'
    depends_on:
      - mariadb
      - redis-queue

  queue-default:
    <<: *crm-service
    restart: unless-stopped
    command: >
      bash -lc 'cd /home/frappe/frappe-bench &&
      bench set-mariadb-host "$${DB_HOST}" &&
      bench set-redis-cache-host "$${REDIS_CACHE}" &&
      bench set-redis-queue-host "$${REDIS_QUEUE}" &&
      bench set-redis-socketio-host "$${REDIS_SOCKETIO}" &&
      bench set-config -g socketio_port "$${SOCKETIO_PORT}" &&
      bench worker --queue default'
    depends_on:
      - mariadb
      - redis-queue

  queue-long:
    <<: *crm-service
    restart: unless-stopped
    command: >
      bash -lc 'cd /home/frappe/frappe-bench &&
      bench set-mariadb-host "$${DB_HOST}" &&
      bench set-redis-cache-host "$${REDIS_CACHE}" &&
      bench set-redis-queue-host "$${REDIS_QUEUE}" &&
      bench set-redis-socketio-host "$${REDIS_SOCKETIO}" &&
      bench set-config -g socketio_port "$${SOCKETIO_PORT}" &&
      bench worker --queue long'
    depends_on:
      - mariadb
      - redis-queue

  scheduler:
    <<: *crm-service
    restart: unless-stopped
    command: >
      bash -lc 'cd /home/frappe/frappe-bench &&
      bench set-mariadb-host "$${DB_HOST}" &&
      bench set-redis-cache-host "$${REDIS_CACHE}" &&
      bench set-redis-queue-host "$${REDIS_QUEUE}" &&
      bench set-redis-socketio-host "$${REDIS_SOCKETIO}" &&
      bench set-config -g socketio_port "$${SOCKETIO_PORT}" &&
      bench schedule'
    depends_on:
      - mariadb
      - redis-queue

volumes:
  mariadb-data:
  sites:
  logs:

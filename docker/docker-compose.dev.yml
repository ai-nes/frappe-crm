# Local development — build image from docker/frappe.Dockerfile
#
#   cd docker
#   docker compose -f docker-compose.dev.yml up -d --build

name: crm-dev

services:
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  frappe:
    build:
      context: .
      dockerfile: frappe.Dockerfile
    user: root
    command: bash /workspace/docker/init.sh
    environment:
      SHELL: /bin/bash
    working_dir: /home/frappe
    volumes:
      - ..:/workspace
      - bench-data:/home/frappe/frappe-bench
      - root-node-modules:/workspace/node_modules
      - frontend-node-modules:/workspace/frontend/node_modules
    ports:
      - "${HTTP_PORT:-8000}:8000"
      - "${SOCKETIO_PORT:-9000}:9000"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mariadb-data:
  bench-data:
  root-node-modules:
  frontend-node-modules:

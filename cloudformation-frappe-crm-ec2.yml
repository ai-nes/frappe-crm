AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Small production EC2 deployment for the Frappe CRM repository.
  Creates an Ubuntu 24.04 host, a public subnet, restricted SSH access,
  encrypted gp3 storage, Docker Compose, and the CRM production stack.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for SSH. The private key stays with you.

  SSHAllowedCidr:
    Type: String
    Description: CIDR allowed to reach SSH, for example 203.0.113.10/32. Do not use 0.0.0.0/0 unless temporary.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  SiteName:
    Type: String
    Description: Public DNS name for the Frappe site, for example crm.example.com. Point its A record to the stack Elastic IP.
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9.-]{1,251}[A-Za-z0-9]$

  RepositoryUrl:
    Type: String
    Default: https://github.com/ai-nes/frappe-crm.git
    Description: Public Git repository URL. For a private repository, use a deploy key or CI image instead of embedding a token.

  RepositoryRef:
    Type: String
    Default: main
    Description: Git branch or tag to deploy.

  AdminPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    MaxLength: 128
    AllowedPattern: ^[A-Za-z0-9@#%+=:,._-]+$
    Description: Frappe Administrator password. Use letters, numbers, and the listed symbols only.

  MySQLRootPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 128
    AllowedPattern: ^[A-Za-z0-9@#%+=:,._-]+$
    Description: MariaDB root password. Use letters, numbers, and the listed symbols only.

  InstanceType:
    Type: String
    Default: t3.large
    AllowedValues:
      - t3.large
      - t3.xlarge
    Description: t3.large is the baseline. Use t3.xlarge for heavier imports or more concurrent users.

  RootVolumeSize:
    Type: Number
    Default: 80
    MinValue: 80
    MaxValue: 16384
    Description: Encrypted gp3 root volume size in GiB. Keep backups outside this volume.

  GunicornWorkers:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4
    Description: Backend worker count. One worker conserves RAM on the baseline instance.

  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm-ssd-gp3/ami-id
    Description: Canonical Ubuntu 24.04 amd64 AMI from the public SSM parameter.

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.42.1.0/24
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs:
              Ref: AWS::Region
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-subnet'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  CrmSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Frappe CRM public HTTP and restricted SSH
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: SSH from the operator CIDR only
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHAllowedCidr
        - Description: Public HTTP
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Public HTTPS reserved for a TLS proxy
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: Outbound internet for updates and image builds
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  CrmInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-role'

  CrmInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref CrmInstanceRole

  CrmInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref CrmInstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref CrmSecurityGroup
      Monitoring: true
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref RootVolumeSize
            Iops: 3000
            Throughput: 125
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-ec2'
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/usr/bin/env bash
            set -euxo pipefail
            exec > >(tee -a /var/log/frappe-crm-bootstrap.log | logger -t frappe-crm-bootstrap -s 2>/dev/console) 2>&1

            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y ca-certificates curl git docker.io docker-compose-v2
            systemctl enable --now docker

            # Keep a small swap file so the first image build and asset build do not OOM.
            if [ ! -f /swapfile ]; then
              fallocate -l 4G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=4096
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
            fi

            install -d -m 0755 /opt/frappe-crm
            if [ -d /opt/frappe-crm/.git ]; then
              git -C /opt/frappe-crm fetch --depth 1 origin '${RepositoryRef}'
              git -C /opt/frappe-crm checkout -B deploy FETCH_HEAD
            else
              git clone --depth 1 --branch '${RepositoryRef}' '${RepositoryUrl}' /opt/frappe-crm
            fi

            cat > /opt/frappe-crm/docker/.env <<'CRM_ENV'
            CRM_IMAGE=frappe-crm:ec2
            SITE_NAME=${SiteName}
            ADMIN_PASSWORD=${AdminPassword}
            MYSQL_ROOT_PASSWORD=${MySQLRootPassword}
            HTTP_PORT=80
            SOCKETIO_PORT=9000
            GUNICORN_WORKERS=${GunicornWorkers}
            CRM_ENV
            chmod 600 /opt/frappe-crm/docker/.env

            # The production compose file is registry-oriented and uses pull_policy: always.
            # This override tells the local EC2 build to use the image just built here.
            cat > /opt/frappe-crm/docker/docker-compose.ec2.yml <<'COMPOSE_OVERRIDE'
            services:
              site:
                pull_policy: never
              assets:
                pull_policy: never
              backend:
                pull_policy: never
              websocket:
                pull_policy: never
              queue-short:
                pull_policy: never
              queue-default:
                pull_policy: never
              queue-long:
                pull_policy: never
              scheduler:
                pull_policy: never
            COMPOSE_OVERRIDE

            cd /opt/frappe-crm
            docker build --platform linux/amd64 -f docker/prod.Dockerfile -t frappe-crm:ec2 .
            docker compose --env-file docker/.env \
              -f docker/docker-compose.prod.yml \
              -f docker/docker-compose.ec2.yml \
              config --quiet
            docker compose --env-file docker/.env \
              -f docker/docker-compose.prod.yml \
              -f docker/docker-compose.ec2.yml \
              up -d

            cat > /etc/systemd/system/frappe-crm.service <<'SERVICE_UNIT'
            [Unit]
            Description=Frappe CRM Docker Compose stack
            Requires=docker.service
            After=docker.service network-online.target

            [Service]
            Type=oneshot
            WorkingDirectory=/opt/frappe-crm
            ExecStart=/usr/bin/docker compose --env-file docker/.env -f docker/docker-compose.prod.yml -f docker/docker-compose.ec2.yml up -d
            ExecStop=/usr/bin/docker compose --env-file docker/.env -f docker/docker-compose.prod.yml -f docker/docker-compose.ec2.yml stop
            RemainAfterExit=yes

            [Install]
            WantedBy=multi-user.target
            SERVICE_UNIT
            systemctl daemon-reload
            systemctl enable frappe-crm.service

            docker compose --env-file docker/.env \
              -f docker/docker-compose.prod.yml \
              -f docker/docker-compose.ec2.yml \
              ps

  CrmElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-eip'

  CrmElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt CrmElasticIp.AllocationId
      InstanceId: !Ref CrmInstance

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref CrmInstance

  PublicIp:
    Description: Stable Elastic IP for DNS and SSH
    Value: !Ref CrmElasticIp

  SSHCommand:
    Description: SSH command after the bootstrap finishes
    Value: !Sub 'ssh ubuntu@${CrmElasticIp}'

  CrmUrl:
    Description: HTTP URL after DNS points SiteName to the Elastic IP
    Value: !Sub 'http://${SiteName}'

  BootstrapLogCommand:
    Description: Command to inspect first-boot deployment progress
    Value: !Sub 'ssh ubuntu@${CrmElasticIp} "sudo tail -f /var/log/frappe-crm-bootstrap.log"'

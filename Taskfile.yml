version: "3"

# Local dev only — Frappe app (:8000); Vite (:5000) is optional frontend development
# App: http://crm.localhost:8000/crm

vars:
  COMPOSE: docker compose -f docker/docker-compose.dev.yml
  # Chạy bench đúng user + workdir (root sẽ bị warn và exit)
  EXEC: docker exec -u frappe -w /home/frappe/frappe-bench crm-dev-frappe-1
  BENCH: bench --site crm.localhost

tasks:
  default:
    desc: Danh sách lệnh
    cmds:
      - task --list

  # --- Chạy app ---

  setup:
    desc: Lần đầu — bật backend + cài frontend deps
    cmds:
      - task: up
      - task: deps

  up:
    desc: Bật backend (Docker)
    cmds:
      - "{{.COMPOSE}} up -d"

  fe:
    desc: Frontend dev server (:5000)
    cmds:
      - yarn dev

  down:
    desc: Tắt backend
    cmds:
      - "{{.COMPOSE}} down"

  deps:
    desc: Cài frontend deps (khi yarn.lock đổi)
    aliases: [install-fe]
    cmds:
      - cd frontend && yarn install --check-files

  # --- Backend ---

  migrate:
    desc: Schema, patches, workspace sync
    cmds:
      - python scripts/validate_doctype_json.py
      - "{{.EXEC}} {{.BENCH}} migrate"

  workspace:
    desc: Sync Desk workspace Frappe CRM
    aliases: [sync-workspace]
    cmds:
      - "{{.EXEC}} {{.BENCH}} execute crm.install.sync_frappe_crm_workspace"

  restart:
    desc: Reload Python sau khi sửa BE
    cmds:
      - "{{.COMPOSE}} restart frappe"

  cache:
    desc: Xóa cache site crm.localhost
    aliases: [clear-cache]
    cmds:
      - "{{.EXEC}} {{.BENCH}} clear-cache"

  build:
    desc: Compile translations (vi.po/en.po) → .mo, cần sau khi sửa locale
    aliases: [compile-translations]
    cmds:
      - "{{.EXEC}} bench build --apps crm"

  i18n:
    desc: Migrate + compile translations (dùng sau khi sửa DocType + locale)
    cmds:
      - task: migrate
      - task: build
      - task: cache

  seed:
    desc: Seed duy nhất bộ dữ liệu CRM đầy đủ và in coverage manifest
    # The seed reads compact JSON extracted from the operational workbooks.
    # Run `task extract-school-json` after replacing either source workbook.
    cmds:
      - "{{.EXEC}} {{.BENCH}} set-config crm_phase2_fixture_password 123456"
      # Keep the local Student Detail workflow enabled after seeding so the
      # context projection and typed admissions actions are available in CRM.
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_routing_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_sla_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_context_read_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_engagement_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_lifecycle_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_conversion_read_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_conversion_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_phase9_governance_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_phase9_audit_read_enabled 1"
      # The Student intake and command-receipt services require durable local
      # HMAC keys. Bootstrap only missing keys; never overwrite a rotated key.
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_showcase.ensure_local_integrity_keys"
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_showcase.execute"

  extract-school-json:
    desc: Trích các field cần cho school-domain seed từ Excel sang JSON gọn
    cmds:
      - python -X utf8 -m crm.demo.extract_school_domain_json

  seed-reset:
    desc: Xoá business rows của bộ demo CRM curated (giữ lại audit/receipt/ledger)
    cmds:
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_showcase.reset"

  seed-verify:
    desc: Kiểm tra mọi state value trong coverage matrix đã có bản ghi
    cmds:
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_showcase.verify"

  pull:
    desc: Sau git pull — deps + migrate + clear-cache + restart
    cmds:
      - task: deps
      - task: migrate
      - task: cache
      - task: restart

  # --- Docker / debug ---

  docker-build:
    desc: Rebuild image sau khi sửa Dockerfile hoặc compose dev
    aliases: [rebuild]
    cmds:
      - "{{.COMPOSE}} up -d --build --force-recreate frappe"

  reset:
    desc: Xóa DB + bench volume, tạo lại stack
    prompt: Xóa toàn bộ data local. Tiếp tục?
    cmds:
      - "{{.COMPOSE}} down -v"
      - "{{.COMPOSE}} up -d"

  logs:
    desc: Theo dõi backend logs
    cmds:
      - "{{.COMPOSE}} logs -f frappe"

  bench:
    desc: "Bench tùy ý — vd: task bench -- console"
    cmds:
      - "{{.EXEC}} {{.BENCH}} {{.CLI_ARGS}}"

  shell:
    desc: Shell trong container Frappe (user frappe)
    cmds:
      - docker exec -it -u frappe -w /home/frappe/frappe-bench crm-dev-frappe-1 bash

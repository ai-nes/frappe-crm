version: "3"

# Local dev only — Frappe app (:8000); Vite (:5000) is optional frontend development
# App: http://crm.localhost:8000/crm

vars:
  COMPOSE: docker compose -f docker/docker-compose.dev.yml
  # Chạy bench đúng user + workdir (root sẽ bị warn và exit)
  EXEC: docker exec -u frappe -w /home/frappe/frappe-bench crm-dev-frappe-1
  BENCH: bench --site crm.localhost

tasks:
  default:
    desc: Danh sách lệnh
    cmds:
      - task --list

  # --- Chạy app ---

  setup:
    desc: Lần đầu — bật backend + cài frontend deps
    cmds:
      - task: up
      - task: deps

  up:
    desc: Bật backend (Docker)
    cmds:
      - "{{.COMPOSE}} up -d"

  fe:
    desc: Frontend dev server (:5000)
    cmds:
      - yarn dev

  down:
    desc: Tắt backend
    cmds:
      - "{{.COMPOSE}} down"

  deps:
    desc: Cài frontend deps (khi yarn.lock đổi)
    aliases: [install-fe]
    cmds:
      - cd frontend && yarn install --check-files

  # --- Backend ---

  migrate:
    desc: Schema, patches, workspace sync
    cmds:
      - "{{.EXEC}} {{.BENCH}} migrate"

  workspace:
    desc: Sync Desk workspace Frappe CRM
    aliases: [sync-workspace]
    cmds:
      - "{{.EXEC}} {{.BENCH}} execute crm.install.sync_frappe_crm_workspace"

  restart:
    desc: Reload Python sau khi sửa BE
    cmds:
      - "{{.COMPOSE}} restart frappe"

  cache:
    desc: Xóa cache site crm.localhost
    aliases: [clear-cache]
    cmds:
      - "{{.EXEC}} {{.BENCH}} clear-cache"

  build:
    desc: Compile translations (vi.po/en.po) → .mo, cần sau khi sửa locale
    aliases: [compile-translations]
    cmds:
      - "{{.EXEC}} bench build --apps crm"

  i18n:
    desc: Migrate + compile translations (dùng sau khi sửa DocType + locale)
    cmds:
      - task: migrate
      - task: build
      - task: cache

  seed:
    desc: Seed cohort tuyển sinh local gồm tài khoản và Student nghiệp vụ thực tế
    aliases: [seed-student, seed-sample-student]
    cmds:
      - "{{.EXEC}} {{.BENCH}} set-config crm_phase2_fixture_password 123456"
      # Keep the local Student Detail workflow enabled after seeding so the
      # context projection and typed admissions actions are available in CRM.
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_routing_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_sla_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_context_read_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_engagement_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_lifecycle_write_enabled 1"
      # The Student intake and command-receipt services require durable local
      # HMAC keys. Bootstrap only missing keys; never overwrite a rotated key.
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_local_admissions.ensure_local_integrity_keys"
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_local_admissions.execute"

  seed-phase345:
    desc: Seed một Student demo đầy đủ Ownership, SLA, routing và lifecycle (chỉ local demo)
    cmds:
      - "{{.EXEC}} {{.BENCH}} set-config crm_phase2_fixture_password 123456"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_routing_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_sla_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_context_read_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_engagement_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_lifecycle_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_student.execute"
      - "{{.COMPOSE}} restart frappe"

  e2e-seed:
    desc: Seed the disposable Playwright Lead-processing cohort and manifest
    cmds:
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_playwright.execute"

  e2e-reset:
    desc: Remove only the disposable Playwright cohort and manifest
    cmds:
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_playwright.reset"

  e2e-enable:
    desc: Enable guarded Playwright writes on local crm.localhost only
    cmds:
      - "{{.EXEC}} {{.BENCH}} set-config crm_playwright_disposable 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_playwright_test_seam_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_routing_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_sla_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_context_read_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_engagement_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_lifecycle_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_conversion_read_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_conversion_write_enabled 1"
      - "{{.EXEC}} {{.BENCH}} set-config crm_phase9_audit_read_enabled 1"

  e2e-disable:
    desc: Disable Playwright fixture guard and server-side write flags
    cmds:
      - "{{.EXEC}} {{.BENCH}} set-config crm_playwright_disposable 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_playwright_test_seam_enabled 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_playwright_test_clock ''"
      - "{{.EXEC}} {{.BENCH}} set-config crm_playwright_e2e_run_id ''"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_routing_enabled 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_sla_enabled 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_context_read_enabled 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_engagement_write_enabled 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_lifecycle_write_enabled 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_conversion_read_enabled 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_student_conversion_write_enabled 0"
      - "{{.EXEC}} {{.BENCH}} set-config crm_phase9_audit_read_enabled 0"

  e2e-playwright:
    desc: Run guarded Chromium E2E tests against an explicitly disposable site
    cmds:
      - cd frontend && npm run test:e2e

  e2e-playwright-install:
    desc: Install the Chromium binary required by Playwright
    cmds:
      - cd frontend && npm run e2e:install

  e2e-preflight:
    desc: Claim and validate the run-scoped disposable E2E harness
    requires:
      vars: [E2E_RUN_ID]
    cmds:
      - "{{.EXEC}} {{.BENCH}} set-config crm_playwright_e2e_run_id {{.E2E_RUN_ID}}"
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_playwright.acquire_lease"
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_playwright.preflight"
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_playwright.execute"

  e2e-release:
    desc: Release only the current run lease (does not purge immutable audit evidence)
    requires:
      vars: [E2E_RUN_ID]
    cmds:
      - "{{.EXEC}} {{.BENCH}} execute crm.demo.seed_playwright.release_lease"

  e2e-full:
    desc: Guarded E2E supervisor; requires an externally generated E2E_RUN_ID
    requires:
      vars: [E2E_RUN_ID]
    cmds:
      # Task defers run when a later command fails, so the write flags cannot
      # survive a failed Playwright process. Lease release is intentionally
      # separate: a crashed run must remain visible until its TTL expires.
      - defer:
          task: e2e-disable
      - task: e2e-enable
      - task: e2e-preflight
      - cmd: cd frontend && $env:PLAYWRIGHT_E2E_ENABLED='1'; $env:PLAYWRIGHT_FIXTURE_MANIFEST=(Resolve-Path "playwright-fixture.{{.E2E_RUN_ID}}.json"); npm run test:e2e
      - task: e2e-release

  pull:
    desc: Sau git pull — deps + migrate + clear-cache + restart
    cmds:
      - task: deps
      - task: migrate
      - task: cache
      - task: restart

  # --- Docker / debug ---

  docker-build:
    desc: Rebuild image sau khi sửa Dockerfile hoặc compose dev
    aliases: [rebuild]
    cmds:
      - "{{.COMPOSE}} up -d --build --force-recreate frappe"

  reset:
    desc: Xóa DB + bench volume, tạo lại stack
    prompt: Xóa toàn bộ data local. Tiếp tục?
    cmds:
      - "{{.COMPOSE}} down -v"
      - "{{.COMPOSE}} up -d"

  logs:
    desc: Theo dõi backend logs
    cmds:
      - "{{.COMPOSE}} logs -f frappe"

  bench:
    desc: "Bench tùy ý — vd: task bench -- console"
    cmds:
      - "{{.EXEC}} {{.BENCH}} {{.CLI_ARGS}}"

  shell:
    desc: Shell trong container Frappe (user frappe)
    cmds:
      - docker exec -it -u frappe -w /home/frappe/frappe-bench crm-dev-frappe-1 bash

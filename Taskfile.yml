version: '3'

# Local dev only — backend Docker (:8000) + frontend Vite (:5000)
# App: http://crm.localhost:5000/crm

vars:
  COMPOSE: docker compose -f docker/docker-compose.dev.yml
  BENCH: cd /home/frappe/frappe-bench && bench --site crm.localhost

tasks:
  default:
    desc: Danh sách lệnh
    cmds:
      - task --list

  # --- Chạy app ---

  setup:
    desc: Lần đầu — bật backend + cài frontend deps
    cmds:
      - task: up
      - task: deps

  up:
    desc: Bật backend (Docker)
    cmds:
      - '{{.COMPOSE}} up -d'

  fe:
    desc: Frontend dev server (:5000)
    cmds:
      - yarn dev

  down:
    desc: Tắt backend
    cmds:
      - '{{.COMPOSE}} down'

  deps:
    desc: Cài frontend deps (khi yarn.lock đổi)
    aliases: [install-fe]
    cmds:
      - cd frontend && yarn install --check-files

  # --- Backend ---

  migrate:
    desc: Schema, patches, workspace sync
    cmds:
      - '{{.COMPOSE}} exec frappe bash -lc "{{.BENCH}} migrate"'

  restart:
    desc: Reload Python sau khi sửa BE
    cmds:
      - '{{.COMPOSE}} restart frappe'

  cache:
    desc: Xóa cache site crm.localhost
    aliases: [clear-cache]
    cmds:
      - '{{.COMPOSE}} exec frappe bash -lc "{{.BENCH}} clear-cache"'

  pull:
    desc: Sau git pull — deps + migrate + clear-cache + restart
    cmds:
      - task: deps
      - task: migrate
      - task: cache
      - task: restart

  # --- Docker / debug ---

  rebuild:
    desc: Rebuild image sau khi sửa Dockerfile hoặc compose dev
    aliases: [build]
    cmds:
      - '{{.COMPOSE}} up -d --build --force-recreate frappe'

  reset:
    desc: Xóa DB + bench volume, tạo lại stack
    prompt: Xóa toàn bộ data local. Tiếp tục?
    cmds:
      - '{{.COMPOSE}} down -v'
      - '{{.COMPOSE}} up -d'

  logs:
    desc: Theo dõi backend logs
    cmds:
      - '{{.COMPOSE}} logs -f frappe'

  bench:
    desc: 'Bench tùy ý — vd: task bench -- --site crm.localhost console'
    cmds:
      - '{{.COMPOSE}} exec frappe bash -lc "cd /home/frappe/frappe-bench && bench {{.CLI_ARGS}}"'

  shell:
    desc: Shell trong container Frappe
    cmds:
      - '{{.COMPOSE}} exec frappe bash'

version: '3'

vars:
  DEV_COMPOSE: docker compose -f docker/docker-compose.dev.yml
  BENCH_DIR: /home/frappe/frappe-bench
  SITE: crm.localhost

tasks:
  default:
    desc: Show available local development tasks
    cmds:
      - task --list

  setup:
    desc: First-time setup for backend containers and frontend dependencies
    cmds:
      - '{{.DEV_COMPOSE}} up -d'
      - cd frontend && yarn install --check-files

  up:
    desc: Start local backend stack
    cmds:
      - '{{.DEV_COMPOSE}} up -d'

  down:
    desc: Stop local backend stack
    cmds:
      - '{{.DEV_COMPOSE}} down'

  ps:
    desc: Show local backend containers
    cmds:
      - '{{.DEV_COMPOSE}} ps'

  fe:
    desc: Start frontend dev server on port 5000
    cmds:
      - yarn dev

  install-fe:
    desc: Install frontend dependencies
    cmds:
      - cd frontend && yarn install --check-files

  logs:
    desc: Follow Frappe backend logs
    cmds:
      - '{{.DEV_COMPOSE}} logs -f frappe'

  restart:
    desc: Restart Frappe backend service
    cmds:
      - '{{.DEV_COMPOSE}} restart frappe'

  migrate:
    desc: Run Frappe migrate for the local CRM site
    cmds:
      - '{{.DEV_COMPOSE}} exec frappe bash -lc ''cd {{.BENCH_DIR}} && bench --site {{.SITE}} migrate'''

  clear-cache:
    desc: Clear local Frappe cache
    cmds:
      - '{{.DEV_COMPOSE}} exec frappe bash -lc ''cd {{.BENCH_DIR}} && bench --site {{.SITE}} clear-cache'''

  compile-locale:
    desc: Compile vi.po to mo after locale edits
    cmds:
      - '{{.DEV_COMPOSE}} exec frappe bash -lc ''cd {{.BENCH_DIR}} && bench --site {{.SITE}} migrate && bench --site {{.SITE}} clear-cache'''

  console:
    desc: Open Frappe console for the local CRM site
    cmds:
      - '{{.DEV_COMPOSE}} exec frappe bash -lc ''cd {{.BENCH_DIR}} && bench --site {{.SITE}} console'''

  bench:
    desc: Run a bench command, for example task bench -- --site crm.localhost list-apps
    cmds:
      - '{{.DEV_COMPOSE}} exec frappe bash -lc ''cd {{.BENCH_DIR}} && bench {{.CLI_ARGS}}'''

  shell:
    desc: Open a shell inside the Frappe backend container
    cmds:
      - '{{.DEV_COMPOSE}} exec frappe bash'

  test-fe:
    desc: Run frontend unit tests once
    cmds:
      - cd frontend && yarn test:run

  build:
    desc: Rebuild local Frappe development image after Dockerfile changes
    cmds:
      - '{{.DEV_COMPOSE}} build frappe'

  recreate:
    desc: Recreate local Frappe backend container after compose changes
    cmds:
      - '{{.DEV_COMPOSE}} up -d --force-recreate frappe'

  reset:
    desc: Delete local Docker volumes and recreate the backend stack
    prompt: This deletes the local database and bench volumes. Continue?
    cmds:
      - '{{.DEV_COMPOSE}} down -v'
      - '{{.DEV_COMPOSE}} up -d'

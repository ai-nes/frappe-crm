name: Build and Push Production Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".pi/**"
      - ".vscode/**"

env:
  IMAGE_NAME: crm-frappe
  PLATFORMS: linux/amd64

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dockerhub:
    name: Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod.Dockerfile
          push: true
          pull: true
          platforms: ${{ env.PLATFORMS }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Verify commit image is available in Docker Hub
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  deploy-ec2:
    name: Deploy to EC2
    needs: dockerhub
    if: ${{ needs.dockerhub.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Backup production site before migration
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
            set -euo pipefail
            cd /opt/frappe-crm
            SITE_NAME="$(grep -E '^SITE_NAME=' docker/.env | head -1 | cut -d= -f2-)"
            test -n "$SITE_NAME"
            BACKEND_CONTAINER="$(sudo docker ps \
              --filter label=com.docker.compose.project=crm-prod \
              --filter label=com.docker.compose.service=backend \
              --format "{{.ID}}" | head -1)"
            test -n "$BACKEND_CONTAINER"
            sudo docker exec -w /home/frappe/frappe-bench "$BACKEND_CONTAINER" \
              bench --site "$SITE_NAME" backup --with-files
          REMOTE

      - name: Upload production Compose file
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes \
            docker/docker-compose.prod.yml \
            "$EC2_USER@$EC2_HOST:/tmp/frappe-crm-docker-compose.prod.yml"
          ssh -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo install -o root -g root -m 0644 \
             /tmp/frappe-crm-docker-compose.prod.yml \
             /opt/frappe-crm/docker/docker-compose.prod.yml && \
             rm -f /tmp/frappe-crm-docker-compose.prod.yml"

      - name: Pull image and restart production stack
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$DOCKER_PASSWORD" | ssh -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo docker login --username '$DOCKER_USERNAME' --password-stdin && \
             test -f /opt/frappe-crm/docker/.env && \
             cd /opt/frappe-crm && \
             export CRM_IMAGE='$DOCKER_USERNAME/$IMAGE_NAME:$IMAGE_TAG' && \
             sudo docker pull '$DOCKER_USERNAME/$IMAGE_NAME:$IMAGE_TAG' && \
             sudo --preserve-env=CRM_IMAGE docker compose --env-file docker/.env -f docker/docker-compose.prod.yml config --quiet && \
             sudo --preserve-env=CRM_IMAGE docker compose --env-file docker/.env -f docker/docker-compose.prod.yml pull && \
             sudo --preserve-env=CRM_IMAGE docker compose --env-file docker/.env -f docker/docker-compose.prod.yml up -d --remove-orphans && \
             sudo --preserve-env=CRM_IMAGE docker compose --env-file docker/.env -f docker/docker-compose.prod.yml restart nginx && \
             sudo --preserve-env=CRM_IMAGE docker compose --env-file docker/.env -f docker/docker-compose.prod.yml ps"
